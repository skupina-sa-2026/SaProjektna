name: CI-CD

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  smartlocker-backend:
    name: SmartLocker backend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RAI/SmartLocker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm install

      - name: Run backend tests
        run: npm test

  smartlocker-frontend:
    name: SmartLocker frontend tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RAI/SmartLocker/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  face-api-tests:
    name: ORV face API tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ORV/cv-project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run ORV tests
        env:
          PYTHONPATH: ${{ github.workspace }}/ORV/cv-project
        run: pytest

  android-unit-tests:
    name: Android unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: PJ/MobiApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare local properties
        run: |
          echo "DIRECT4ME_API_KEY=${{ secrets.DIRECT4ME_API_KEY }}" > local.properties
          echo "DIRECT4ME_API_URL=https://api-d4me-stage.direct4.me/sandbox/v1/Access/openbox" >> local.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-latest

    needs:
      - smartlocker-backend
      - smartlocker-frontend
      - face-api-tests
      - android-unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build

  dockerhub-push:
    name: Push Docker images to DockerHub
    runs-on: ubuntu-latest

    needs:
      - docker-build

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push SmartLocker backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-api:latest ./RAI/SmartLocker
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-api:latest

      - name: Build and push SmartLocker frontend
        run: |
          docker build --build-arg VITE_API_URL=http://localhost:5000 -t ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-frontend:latest ./RAI/SmartLocker/frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-frontend:latest

      - name: Build and push ORV face API
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-face-api:latest ./ORV/cv-project
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-face-api:latest