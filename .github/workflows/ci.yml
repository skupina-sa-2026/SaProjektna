name: CI-CD

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  smartlocker-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAI/SmartLocker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RAI/SmartLocker/package-lock.json
      - run: npm ci
      - run: npm test

  smartlocker-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RAI/SmartLocker/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RAI/SmartLocker/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  face-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ORV/cv-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest

  android-unit-tests:
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: PJ/MobiApp

  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - uses: android-actions/setup-android@v3

    - name: Prepare local properties
      run: |
        echo "DIRECT4ME_API_KEY=${{ secrets.DIRECT4ME_API_KEY }}" > local.properties
        echo "DIRECT4ME_API_URL=https://api-d4me-stage.direct4.me/sandbox/v1/Access/openbox" >> local.properties

    - name: Make Gradle wrapper executable
      run: chmod +x ./gradlew

    - name: Run Android unit tests
      run: ./gradlew testDebugUnitTest

  docker-build:
    runs-on: ubuntu-latest
    needs: [smartlocker-backend, smartlocker-frontend, face-api-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Compose services
        run: docker compose build

  dockerhub-push:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push backend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-api:latest ./RAI/SmartLocker
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-api:latest
      - name: Build and push frontend
        run: |
          docker build --build-arg VITE_API_URL=http://localhost:5000 -t ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-frontend:latest ./RAI/SmartLocker/frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-frontend:latest
      - name: Build and push face API
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-face-api:latest ./ORV/cv-project
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/smartlocker-face-api:latest
